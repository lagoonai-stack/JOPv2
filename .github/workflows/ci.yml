name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSION: 3.4
  RAILS_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/rails_test

jobs:

  # =========================
  # 1️⃣ Security Scans
  # =========================
  security:
    name: Security
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: Install gems
        run: bundle install

      # --- Brakeman ---
      - name: Run Brakeman
        continue-on-error: true
        run: bundle update brakeman && bin/brakeman -q

      # --- bundle-audit ---
      - name: Run bundle-audit
        continue-on-error: true
        run: bundle audit update && bundle audit --verbose

  # =========================
  # 2️⃣ Lint
  # =========================
  lint:
    name: Rubocop
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Run Rubocop
        run: bin/rubocop -f github

  # =========================
  # 3️⃣ RSpec (Unit + Integration)
  # =========================
  test:
    name: RSpec
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare database
        run: |
          bin/rails db:test:prepare

      - name: Run RSpec
        run: bin/rspec --format progress

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
